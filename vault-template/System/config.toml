# Preferences. Secrets live in the repo's .env, not here.
# Anything omitted falls back to the defaults in quartermaster/config.py.

[home]
label = "St. Louis, MO"
geopoint = "9yzg"        # Ticketmaster takes a geohash, not raw lat/long
latitude = 38.6270
longitude = -90.1994

# Distance bands for the events section, each queried separately.
# bar: how good an event must be for the model to pick it (low/medium/high).
# max_offered: new shows the model sees per day (default 60); the rest wait.
# taste_only: only events matching a top artist, interests.md, or a genre
# named there (rap, electronic...) reach the model.
[[events.bands]]
name = "local"
min_miles = 0
max_miles = 100
bar = "low"              # STL metro and a short drive: anything up your street
max_offered = 300

[[events.bands]]
name = "travel"
min_miles = 100
max_miles = 500
bar = "high"             # KC, Chicago, Nashville, Memphis, Indy: worth the trip
taste_only = true

[events]
window_days = 30          # how far ahead to look for events worth travelling to
onsale_days = 30          # how far ahead to look for on-sales of acts you like

[notion]
stale_after_days = 90     # must ALSO look unfinished to count as stale
claude_page_id = ""       # the one Notion page (and sub-pages) the agent may write to

[wishlist]
# Paste the wishlist page's id here (from its Notion URL - the 32-char
# string before the "?"). A plain page you edit by hand - not a database.
# An item is price-checked once it has a link: a bookmark block, or a
# hyperlink on a to-do/bulleted line. Leave blank to skip price checks.
page_id = ""

[chat]
# After this many minutes with nothing said (Discord, web chat or terminal),
# the next message starts a fresh conversation: continuing re-sends the whole
# old one every turn. 0 = never start fresh on its own.
fresh_after_minutes = 5

[digest]
weekday = "sunday"        # also the day it lists wishlist links it couldn't read
hour = 8
calendar_days_ahead = 7
ignore_calendar = []      # all-day entries with these in the title are reminders, not plans
keep_days = 30            # archived digests older than this are deleted (git history keeps them); 0 = keep all

[public]
replies_per_hour = 20     # when people in your server just talk to the bot; spends your subscription
context_messages = 25     # recent channel messages it reads before replying (max ~5000 chars); 0 = none
status = "Mention me to chat"  # shown under the bot's name; needs a restart; "" = none

[minecraft]
memory_gb = 4             # heap for the Paper server; you play on the same machine
dir = ""                  # blank: %LOCALAPPDATA%\quartermaster\minecraft

[backups]
dir = 'F:\Backups\servers'  # nightly zips of the game servers (qm backup); the live installs stay put
keep = 14                   # zips kept per game; a night where nothing changed writes none

[resume]
repo = ""                   # the portfolio repo; its resume/resume.tex is the source of truth (qm resume)
