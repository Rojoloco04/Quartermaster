[project]
name = "quartermaster"
version = "0.1.0"
description = "A personal agent: weekly digest, Notion-mirrored memory, Discord and Claude Code."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "notion-client>=2.2.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
bot = ["discord.py>=2.4"]
web = ["starlette>=0.40", "uvicorn>=0.30"]  # qm web (also pulled in by mcp)
integrations = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "msal>=1.28",
    "spotipy>=2.24",
    "mcp>=2.2",  # servers/ - also pulled in by claude-agent-sdk, but imported directly
]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
qm = "quartermaster.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quartermaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
